device:
  prefer_cuda: true


models:

  person:
    path: "weights/yolov8x.pt"
    confidence: 0.15
    min_aspect_ratio: 0.8

  ppe:
    path: "weights/best.pt"
    confidence: 0.25
    keep_best_per_class: true
    min_person_overlap: 0.3


classes:

  ppe:
    helmet: "helmet"
    vest: "vest"
    boots: "boots"


sahi:

  num_cols: 4
  num_rows: 3
  target_size: 1000
  overlap_width: 0.20
  overlap_height: 0.20
  overlap: 0.10
  merge_iou: 0.45


crop:

  width: 512
  height: 640

  scale_padding: 1.40


colors:

  compliant: [0, 255, 0]
  non_compliant: [0, 0, 255]

  ppe:
    helmet: [0, 255, 0]
    vest: [0, 165, 255]
    boots: [255, 0, 255]