<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPE Site Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* ===== Design tokens: the same values as the System Health page and the retraining app (from the Fingo login screen).
   Change them here only; the three pages should share this block. Breakpoints used below: 900 px (one column) and 480 px. ===== */
:root{--font:Montserrat,system-ui,sans-serif;--maxw:1320px;--bg:#3b3b3b;--sf:#2f2f2f;--sf2:#272727;--field:#1e1e1e;--ink:#ffffff;--ink2:#d9d9d9;--ink3:#b3b3b3;--line:rgba(255,255,255,.13);--acc:#8ac646;--accf:#1e1e1e;--ok:#8ac646;--oktx:#8ac646;--bad:#ef6b64;--badtx:#f28b8b;--warn:#f2b134;--unk:#9a9a9a;--hover:rgba(255,255,255,.07);--field-line:transparent;--trk:#2f2f2f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* dark only: the platform keeps the Fingo colours (reviewer decision, October 2026); print uses a light palette below */
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
.w{max-width:var(--maxw);margin:auto;padding:0 16px}
header{background:var(--sf2);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 0}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.logo{font-weight:800;font-size:16px}
.fresh{font-size:11px;color:var(--ink3);font-weight:500}
.proto{font-size:11px;color:var(--ink2);display:flex;gap:6px;align-items:center}
select,button,input{font:600 13px var(--font);color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:34px}
button{cursor:pointer}
button.p{background:var(--acc);color:var(--accf);border-color:transparent}
.seg{display:inline-flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:6px 0 0 6px;margin:0}.seg button:last-child{border-radius:0 6px 6px 0}
.seg .on{background:var(--acc);color:var(--accf)}
nav{display:flex;gap:4px}
nav button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 14px;color:var(--ink2);font-size:14px}
nav .on{color:var(--ink);border-color:var(--acc)}
main{padding:18px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
@media(max-width:900px){.grid{grid-template-columns:1fr}.c2,.c3,.c4,.c6{grid-column:auto}}
h2{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.kpi{font-size:56px;font-weight:800;line-height:1}.sub{color:var(--ink2);font-size:13px;margin-top:6px}
.bad{color:var(--bad)}.ok{color:var(--oktx)}
.row{display:grid;grid-template-columns:70px 1fr 40px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 0}
.track{height:10px;background:var(--sf2);border-radius:5px;overflow:hidden}.track i{display:block;height:100%;background:var(--bad)}
.track.g i{background:var(--ok)}
.hint{font-size:12px;color:var(--ink2);margin:8px 0 0}
svg{display:block;width:100%;height:auto}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
tr[data-a]{cursor:pointer}tr[data-a]:hover{background:var(--sf2)}
.strip{display:flex;gap:3px;overflow-x:auto;padding:4px 0 8px}
.strip button{flex:0 0 12px;height:30px;padding:0;min-height:0;border:0;border-radius:2px;background:var(--line)}
.strip .g{background:var(--ok)}.strip .r{background:var(--bad)}.strip .sel{outline:2px solid var(--ink);outline-offset:1px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.pc{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;width:100%;text-align:left;margin-bottom:8px;padding:8px;background:var(--sf2)}
.pc.sel{outline:2px solid var(--ink)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin:2px 3px 0 0;border:1px solid var(--bad);color:var(--bad)}
.chip.o{border-color:var(--ok);color:var(--oktx)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;z-index:9;max-width:calc(100% - 32px);text-align:center}
.ramp{display:inline-block;width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,#f4b40033,#e8534f);vertical-align:middle;margin:0 6px}

/* match team palette: dark header band, 4px radii, uppercase segmented controls */
header{background:var(--field)}
.card{border-radius:4px}
select,button,input{background:var(--field);border:1px solid var(--field-line);border-radius:4px}
.seg{border:1px solid var(--line);border-radius:4px;background:var(--field);overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0;margin:0;background:transparent;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover);color:var(--ink)}
.seg .on,.seg .on:hover{background:var(--acc);color:var(--accf)}
button.p{background:var(--acc);color:var(--accf);font-weight:800}
.bad{color:var(--badtx)}
.pc,.strip button.sel{border-radius:4px}
.toast{background:var(--acc);color:var(--accf)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.logo{letter-spacing:.01em}

.row{grid-template-columns:130px 1fr 40px}
#zv{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:4px;background:#000;cursor:grab;touch-action:none}
#zi{position:absolute;inset:0;transform-origin:0 0}#zi img{width:100%;height:100%;display:block;user-select:none}
.hl{position:absolute;border:3px solid #fff;box-shadow:0 0 0 2px #000a;pointer-events:none}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.meta span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}.meta b{font-size:18px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}.people .pc{margin:0}
.pc .th{width:56px;height:56px;border-radius:4px;display:block;position:relative;overflow:hidden;background:#141414}.pc .th img{position:absolute;max-width:none;display:block}
.heatbox{position:relative;border-radius:4px;overflow:hidden;background:#141414}.heatbox svg{display:block;width:100%;height:auto}

/* overview header card: camera facts on the left, safety score on the right (same block as the camera dashboard header) */
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 40px;flex-wrap:wrap;background:var(--field);border-color:var(--line);padding:18px 20px 22px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.eyebrow .mu{color:var(--ink3)}
.camname{font-size:36px;font-weight:800;line-height:1;margin:6px 0 8px;letter-spacing:.01em}
.facts{font-size:13px;color:var(--ink2)}
.score{flex:0 1 420px;min-width:min(100%,280px)}
.score-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.01em;margin-top:4px}
.hero .unit{font-size:22px;font-weight:600;color:var(--ink2);margin-left:4px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:4px;border:1px solid var(--line)}
.status.good{border-color:var(--ok);background:color-mix(in oklab,var(--ok) 22%,transparent)}
.status.warn{border-color:var(--warn);background:color-mix(in oklab,var(--warn) 22%,transparent)}
.status.crit{border-color:var(--bad);background:color-mix(in oklab,var(--bad) 26%,transparent)}
.meter{height:6px;border-radius:3px;background:var(--trk);margin-top:12px;overflow:hidden}
.meter .fill{display:block;height:100%;border-radius:3px;background:var(--ok)}
.meter.warn .fill{background:var(--warn)}.meter.crit .fill{background:var(--bad)}
.score-sub{margin-top:8px;font-size:12px;color:var(--ink2);display:flex;gap:14px;flex-wrap:wrap}
.score-sub .up{color:var(--oktx)}.score-sub .down{color:var(--badtx)}
.items{margin-top:12px}
.items .row{grid-template-columns:minmax(120px,auto) minmax(80px,1fr) auto;gap:4px 10px;padding:3px 0;min-height:0;font-size:12px;font-weight:400;color:var(--ink2);align-items:center}
.items .row b{color:var(--ink);font-weight:700}.items .row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.items .track{height:4px;border-radius:2px;background:var(--trk)}

/* worker sightings log (same table as the camera dashboard) */
.log .tbl{margin:10px -16px 0}
.log th{background:var(--sf2);color:var(--ink3)}
.log td{font-size:13px}
.log th.num,.log td.num{text-align:right;font-variant-numeric:tabular-nums}
.log .d{color:var(--ink3);margin-right:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--ink)}
.pill.ok{background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ink)}
.pill.viol{background:color-mix(in oklab,var(--bad) 14%,transparent)}
.pill.unk{background:color-mix(in oklab,var(--unk) 20%,transparent)}
.pill.ok .i{color:var(--oktx)}.pill.viol .i{color:var(--badtx)}.pill.unk .i{color:var(--ink3)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:3px;background:var(--sf2);margin-right:4px;color:var(--ink)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0 0;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.btn{font:700 12px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:transparent;border:2px solid var(--acc);border-radius:4px;padding:5px 14px;min-height:0}
.btn:hover{background:color-mix(in oklab,var(--acc) 18%,transparent)}.btn:disabled{opacity:.4;cursor:default;border-color:var(--ink3)}

/* download reports dialog */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mod{background:var(--sf);border:1px solid var(--line);border-radius:4px;padding:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.rl{max-height:240px;overflow:auto;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:8px 12px}.rs{margin-bottom:8px}.rc{display:block;padding:3px 0 3px 24px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:4px;margin-bottom:8px;cursor:pointer}
.sum{background:var(--field);border-radius:4px;padding:10px 12px;margin:12px 0;font-weight:700}.sum.bad{color:var(--badtx)}
.mf{display:flex;gap:8px;justify-content:flex-end}input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px;min-height:0;margin:2px 0 0}
button:disabled{opacity:.4;cursor:not-allowed}
/* theme, language and time-zone switches: one group so they wrap together; compact like the camera dashboard */
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw .seg button{padding:4px 10px;min-height:28px}
/* a segmented control with many choices (image filters) wraps onto more rows on a phone instead of clipping */
.seg.wrap{flex-wrap:wrap}.seg.wrap button{border-bottom:1px solid var(--line);margin-bottom:-1px}

/* unknown state, keyboard focus on rows, notices, trend hover, phone sizes */
.chip.u{border-color:var(--ink3);color:var(--ink3)}
tr[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.notice{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;background:var(--field);border:1px solid var(--warn);border-radius:4px;padding:10px 12px;margin:0 0 14px;font-size:13px}
.note{margin-top:12px;padding:8px 10px;border-left:3px solid var(--warn);background:var(--sf);font-size:12px;color:var(--ink2);border-radius:0 4px 4px 0;max-width:560px}
.lnk{background:none;border:0;padding:0;min-height:0;font:inherit;font-weight:700;color:var(--acc);text-decoration:underline;cursor:pointer}
svg.trend{cursor:crosshair}.tc line{stroke:var(--ink2);stroke-dasharray:3 3}.tc rect{fill:var(--field);stroke:var(--line)}.tc text{font-size:10px;font-weight:700;fill:var(--ink)}
.po{display:none}
@media(max-width:480px){.camname{font-size:28px}.hero{font-size:44px}.kpi{font-size:44px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* print: the browser's "Save as PDF" stands in for the report service until it exists (see requestReport) */
@media print{
:root{--bg:#fff;--sf:#fff;--sf2:#f2f3f6;--field:#fff;--ink:#141920;--ink2:#333a46;--ink3:#6b7382;--line:#c9ccd3;--acc:#6d9b3a;--accf:#141920;--ok:#6d9b3a;--oktx:#45701b;--bad:#d13f38;--badtx:#a12a24;--warn:#d9960a;--unk:#6b7382;--trk:#e4e7ec;color-scheme:light}
body{background:#fff}
header,.toast,.ov,.strip,.pager,.notice,.hint,.tc{display:none!important}
.po{display:block;font-weight:700;font-size:14px;margin:0 0 12px}
main{padding:0}
.card,.hd{break-inside:avoid;border-color:var(--line)}.hd{background:#fff}
.tbl{overflow:visible}th,td{white-space:normal}
#zv{cursor:default}
}
</style>
</head>

let qt=null;document.addEventListener('input',e=>{const t=e.target;if(t.id=='q')S.q=t.value;else if(t.id=='rq'&&S.rp)S.rp.q=t.value;else return;clearTimeout(qt);qt=setTimeout(render,120)});   // debounced: the whole page re-renders
document.addEventListener('keydown',e=>{const t=e.target;
if(e.key=='Escape'&&S.rp){act('rclose');return}
if(e.key=='Tab'&&S.rp){const m=document.querySelector('.mod');if(!m)return;const f=[...m.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled])')];if(!f.length)return;const i=f.indexOf(document.activeElement);
if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i<0||i==f.length-1)){e.preventDefault();f[0].focus()}return}   // keep Tab inside the dialog
if((e.key=='Enter'||e.key==' ')&&t&&t.matches&&t.matches('[data-a][tabindex]')){e.preventDefault();act(t.dataset.a,t.dataset.v);return}   // table rows
if(S.tab=='img'&&!S.rp&&!['INPUT','SELECT'].includes(t.tagName)){if(e.key=='ArrowRight')act('step','1');if(e.key=='ArrowLeft')act('step','-1')}});
/* viewer: drag to pan, wheel to zoom at the pointer, two fingers to pinch */
const PTS=new Map();let pinch=null;
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#zv'))return;PTS.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(PTS.size==2){const[a,b]=[...PTS.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};dr=null}else if(Z.s>1)dr={x:e.clientX,y:e.clientY,zx:Z.x,zy:Z.y}});
document.addEventListener('pointermove',e=>{if(PTS.has(e.pointerId))PTS.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(pinch&&PTS.size==2){const[a,b]=[...PTS.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(d>0&&pinch.d>0&&document.getElementById('zv')){const r=zr();zoomAt(d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top)}pinch.d=d;return}
if(dr){Z.x=dr.zx+e.clientX-dr.x;Z.y=dr.zy+e.clientY-dr.y;clampZ();applyZ()}});
const up=e=>{PTS.delete(e.pointerId);if(PTS.size<2)pinch=null;if(!PTS.size)dr=null};
document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
document.addEventListener('wheel',e=>{const v=e.target.closest('#zv');if(v){e.preventDefault();const r=v.getBoundingClientRect();zoomAt(e.deltaY<0?1.25:.8,e.clientX-r.left,e.clientY-r.top)}},{passive:false});
/* trend chart: a dashed crosshair snaps to the nearest bucket and reads its value */
document.addEventListener('pointermove',e=>{const s=e.target.closest?e.target.closest('svg.trend'):null;
if(!s){const o=document.querySelector('svg.trend .tc');if(o&&o.style.display!='none')o.style.display='none';return}if(!TREND)return;
const r=s.getBoundingClientRect(),n=TREND.vals.length,step=380/Math.max(1,n-1),x=(e.clientX-r.left)/r.width*400,i=Math.max(0,Math.min(n-1,Math.round((x-10)/step))),v=TREND.vals[i],g=s.querySelector('.tc');
if(v==null){g.style.display='none';return}const px=i*step+10,l=g.querySelector('line'),b=g.querySelector('rect'),t=g.querySelector('text');g.style.display='';
l.setAttribute('x1',px);l.setAttribute('x2',px);t.textContent=TREND.lab[i]+' · '+pct(v);let w=70;try{w=t.getComputedTextLength()+12}catch(x){}const bx=Math.max(2,Math.min(398-w,px-w/2));b.setAttribute('x',bx);b.setAttribute('width',w);t.setAttribute('x',bx+w/2)});
ingest(DATA);render();
/* served over http: results.json next to the page replaces the embedded blob when it exists (the embed stays the file:// fallback) */
if(/^https?:$/.test(location.protocol))fetch('results.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&Array.isArray(d.frames)){ingest(d);if(S.cam&&!CAMS.some(c=>c.id==S.cam)){S.cam=null;S.tab='cams'}render()}}).catch(()=>{});
})();
